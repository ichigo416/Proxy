services:

  proxy:
    build: .
    container_name: custom-proxy
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      - backend1
      - backend2
      - backend3

  backend1:
    image: node:22-alpine
    container_name: backend1
    working_dir: /app
    volumes:
      - ./backends:/app
    command: node server1.js
    expose:
      - "9001"

  backend2:
    image: node:22-alpine
    container_name: backend2
    working_dir: /app
    volumes:
      - ./backends:/app
    command: node server2.js
    expose:
      - "9002"

  backend3:
    image: node:22-alpine
    container_name: backend3
    working_dir: /app
    volumes:
      - ./backends:/app
    command: node server3.js
    expose:
      - "9003" 